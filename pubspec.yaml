name: amoon_worship
description: Offline worship companion (offline)
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/quran_sample.json
    - assets/data/adhkar_sample.json
    - assets/data/sunnah_sample.json
    - assets/data/hadith_sample.json
    - assets/data/dua_sample.json
