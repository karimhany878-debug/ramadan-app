name: ramadan_kareem
description: Ramadan Kareem  offline worship companion
publish_to: "none"
version: 0.2.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  shared_preferences: ^2.5.4
  adhan_dart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/quran_sample.json
    - assets/data/adhkar_sample.json
    - assets/data/sunnah_sample.json
    - assets/data/hadith_sample.json
    - assets/data/dua_sample.json
    - assets/data/prophets_sample.json
